# Which chunks load for each job. Budgets are approximate token caps.
kit: half-acre-club
version: 1
profiles:
  post_generate:
    always: [voice-core, visual-system, art-direction, social-rules, terminology]
    if_relevant:
      - chunk: positioning-core
        when: The post states a fact (price, shipping, founding, box number). Usually promo and announcement.
      - chunk: voice-examples
        when: Always useful for headlines; drop first if over budget.
      - chunk: audience-renters
        when: The brief is about winning new members (promo, announcement).
      - chunk: guardrails
        when: Promo, testimonial, or any post that makes a claim.
    budget: 3000
  post_critique:
    always: [voice-core, art-direction, guardrails, social-rules]
    if_relevant:
      - chunk: terminology
        when: The copy names the product, the members, or a growing step.
      - chunk: positioning-core
        when: The copy states a fact that needs checking against the facts list.
      - chunk: voice-examples
        when: The copy gives an instruction or tip; the examples show which how-to wording the brand already uses.
    budget: 2000
  intake_gaps:
    always: [readme]
    summaries_only: true
    if_relevant:
      - chunk: any
        when: confidence is needs-review
    budget: 1500
