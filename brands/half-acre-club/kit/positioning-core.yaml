summary: >-
  Half Acre Club is a fictional monthly growing kit for renters and first-time
  gardeners. Each box is one small, finishable project, so a person with a
  windowsill and no experience gets a real harvest.
---
what_it_is: >-
  A monthly subscription box. Each box holds one small growing project that
  fits on a windowsill or a shelf: seeds, the growing mix if the project
  calls for it, and a printed card to keep next to it. Containers come from
  home: if a clean takeout tub will do, the card says what size to save.
  Example: pea shoots in a takeout tub, ready to cut in about ten days.
why_one_project: >-
  One project per box, not a variety pack. The customer's problem is not a
  lack of seeds, it's never finishing. One project they can finish beats six
  they abandon.

who_its_for: >-
  Renters in their 20s and 30s in small city apartments. No yard, no balcony
  worth the name, maybe one dead basil plant behind them. They want to grow
  something but assume they can't because of space, light, or a landlord.
  Detail in audience-renters.

promise: You can grow something real in the space you already have.
promise_reason: >-
  Small space is the starting condition, not an obstacle we apologize for.

differentiators:
  - name: Small on purpose
    detail: Projects are sized to a windowsill and a few weeks, so the first win comes fast.
  - name: Nothing to figure out
    detail: >-
      The card says how much room to clear, what light to look for, and what
      to expect along the way, in plain words. It covers the days in between,
      not just seeds and harvest.
  - name: Upfront about room and light
    detail: >-
      If a project takes longer or needs a brighter spot, we say so before
      people order, so they can decide whether this month's box suits their place.
  - name: Renter-proof
    detail: Nothing drills, mounts, or stains. Everything leaves with you when the lease ends.

facts:
  note: >-
    All fictional. Posts may use only these facts plus what a brief supplies.
    Do not add discounts, shipping dates, awards, partner names, or member
    counts that are not listed here.
  price: $24 a month, cancel anytime
  ships: Contiguous US, first week of each month
  founded: Philadelphia, by Dana Reyes, a former apartment-dweller with a very crowded windowsill
  first_box: Pea shoots, Box 01. The club is new; don't imply a long history.
  box_numbering: Boxes are numbered in order (Box 01, Box 02, ...)
  origin_story: >-
    It started with pea shoots in a takeout tub with the date on masking tape,
    turned around when they leaned toward the glass, and cut onto scrambled eggs.
  name_meaning: >-
    Half an acre sounded enormous next to a strip of windowsill mostly taken
    up by the dish soap. The name made the founders laugh, and it stuck.
