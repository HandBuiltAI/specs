<!doctype html>
<html><head><meta charset="utf-8">{{{head}}}
<style>
  .photo-wrap { position: absolute; top: var(--safe-margin); left: var(--safe-margin); right: var(--safe-margin); height: 700px; }
  .photo-wrap .photo { width: 100%; height: 100%; }
  /* Stamp: accent ink on the background, slightly off-square, never a filled button. */
  .stamp { position: absolute; right: 40px; bottom: -60px; background: var(--role-background); color: var(--role-accent); border: 6px solid var(--role-accent); border-radius: calc(var(--radius) * 2); padding: 18px 30px 14px; font-family: var(--font-wordmark); font-weight: var(--weight-wordmark); font-variation-settings: var(--variation-wordmark, normal); font-size: 76px; line-height: 1; letter-spacing: -0.02em; transform: rotate(var(--stamp-rotation)); white-space: nowrap; }
  .copy { position: absolute; left: var(--safe-margin); right: var(--safe-margin); top: 860px; }
  .copy .headline { font-size: 80px; margin-bottom: 22px; max-width: 820px; }
  .copy .subhead { margin-bottom: 36px; }
</style></head>
<body><main class="post post--4x5">
  <div class="photo-wrap">
    <img class="photo" src="{{{photo_src}}}" alt="">
    <div class="stamp">{{badge}}</div>
  </div>
  <div class="copy">
    <h1 class="headline">{{headline}}</h1>
    <p class="subhead">{{subhead}}</p>
    <span class="cta">{{cta}}</span>
  </div>
  <div class="wordmark">{{{wordmark}}}</div>
</main></body></html>
