<!doctype html>
<html><head><meta charset="utf-8">{{{head}}}
<style>
  .photo-wrap { position: absolute; top: var(--safe-margin); left: var(--safe-margin); right: var(--safe-margin); height: 800px; }
  .photo-wrap .photo { width: 100%; height: 100%; }
  .photo-wrap .tape { position: absolute; left: 36px; bottom: -34px; }
  .copy { position: absolute; left: var(--safe-margin); right: var(--safe-margin); top: 940px; padding-right: 150px; }
  .copy .headline { font-size: 84px; margin-bottom: 22px; max-width: 760px; }
</style></head>
<body><main class="post post--4x5">
  <div class="photo-wrap">
    <img class="photo" src="{{{photo_src}}}" alt="">
    {{#badge}}<div class="tape"><div class="hand">{{badge}}</div></div>{{/badge}}
  </div>
  <div class="copy">
    <h1 class="headline">{{headline}}</h1>
    <p class="subhead">{{subhead}}</p>
  </div>
  <div class="wordmark">{{{wordmark}}}</div>
</main></body></html>
