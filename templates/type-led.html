<!doctype html>
<html><head><meta charset="utf-8">{{{head}}}
<style>
  .copy { position: absolute; left: var(--safe-margin); right: var(--safe-margin); top: 46%; transform: translateY(-50%); }
  .copy .headline { font-size: 104px; margin-bottom: 44px; max-width: 900px; }
  .copy .subhead { font-size: 44px; max-width: 820px; }
  .note { position: absolute; left: var(--safe-margin); bottom: calc(var(--safe-margin) + 8px); }
</style></head>
<body><main class="post post--1x1">
  <div class="copy">
    <h1 class="headline">{{headline}}</h1>
    <p class="subhead">{{subhead}}</p>
  </div>
  {{#badge}}<div class="note hand">{{badge}}</div>{{/badge}}
  <div class="wordmark">{{{wordmark}}}</div>
</main></body></html>
